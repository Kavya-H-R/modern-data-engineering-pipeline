services:
  airflow:
    image: apache/airflow:3.3.1-python3.12
    container_name: sales-airflow
    command: standalone
    working_dir: /opt/airflow/project

    ports:
      - "8080:8080"

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./data:/opt/airflow/project/data
      - ./sql:/opt/airflow/project/sql